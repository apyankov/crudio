
management.endpoints.web.exposure.include=prometheus,health,info,loggers,heapdump
management.endpoints.web.base-path=/actuator
management.endpoints.web.path-mapping.prometheus=/prometheus
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.slo.http.server.requests=50ms, 100ms, 250ms, 500ms, 1000ms, 2500ms, 5000ms
management.metrics.distribution.slo.http.client.requests=50ms, 100ms, 250ms, 500ms, 1000ms, 2500ms, 5000ms
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.heapdump.enabled=true
management.endpoint.heapdump.cache.time-to-live=10000

spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER
springdoc.show-actuator = false
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.default-model-rendering=example
springdoc.swagger-ui.disp
springdoc.api-docs.enabled=false
